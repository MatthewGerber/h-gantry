<button type="button" class="btn btn-primary" id="gantry-1-center">Center</button>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
const gantry_1_center = $("#gantry-1-center");
function on_press_center () {
  let dyn_args_query = "";
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/center?add_to_history=bool:True&block=bool:True&mm_per_sec=float:100.0" + dyn_args_query,
    type: "GET"
  });
}
gantry_1_center.on("mousedown touchstart", function () {
  on_press_center();
});
</script>
