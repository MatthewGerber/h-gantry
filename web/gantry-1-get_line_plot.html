<div style="text-align: center">
  <img alt="gantry-1-get-line-plot" id="gantry-1-get_line_plot" width="600" src="" />
  <label id="gantry-1-latency">Latency (ms):  None</label>
</div>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
import {init_latency, set_call_time, update_latency} from "./utils.js";
const gantry_1_latency = $("#gantry-1-latency")[0];
init_latency("gantry-1-latency", 1.0);
const gantry_1_get_line_plot = $("#gantry-1-get_line_plot")[0];
async function capture_gantry_1_get_line_plot() {
  set_call_time("gantry-1-latency");
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/get_line_plot",
    type: "GET",
    success: async function (return_value) {
      gantry_1_get_line_plot.src = "data:image/jpg;base64," + return_value;
      gantry_1_latency.innerHTML = "Latency (ms):  " + update_latency("gantry-1-latency").toFixed(0);
      await new Promise(r => setTimeout(r, 1000.0));
      await capture_gantry_1_get_line_plot();
    },
    error: async function(xhr, error){
      console.log(error);
      await new Promise(r => setTimeout(r, 1000.0));
      await capture_gantry_1_get_line_plot();
    }
  });
}
capture_gantry_1_get_line_plot();
</script>
