<div class="form-check form-switch switch-container">
  <input class="form-check-input" type="checkbox" role="switch" id="gantry-1-enable-disable"/>
  <label class="form-check-label" for="gantry-1-enable-disable">Enabled</label>
</div>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
const gantry_1_enable_disable = $("#gantry-1-enable-disable");
gantry_1_enable_disable.on("change", function () {
  $.ajax({
    url: gantry_1_enable_disable.is(":checked") ? "http://" + rest_host + ":" + rest_port + "/call/gantry-1/enable" : "http://" + rest_host + ":" + rest_port + "/call/gantry-1/disable",
    type: "GET"
  });
});
async function gantry_1_enable_disable_enabled() {
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/enabled",
    type: "GET",
    success: async function (return_value) {
      gantry_1_enable_disable.prop("checked", return_value);
      await new Promise(r => setTimeout(r, 1000.0));
      await gantry_1_enable_disable_enabled();
    },
    error: async function(xhr, error){
      console.log(error);
      await new Promise(r => setTimeout(r, 1000.0));
      await gantry_1_enable_disable_enabled();
    }
  });
}
gantry_1_enable_disable_enabled();
</script>
