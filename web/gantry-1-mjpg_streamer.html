<div style="height:480px;display:flex;justify-content:center" id="gantry-1-mjpg_streamer"></div>
<script type="module">
import {rest_host} from "./globals.js";
let image_id = 0;
let loaded_images = [];
async function insert_new_image_gantry_1_mjpg_streamer() {
  let img = new Image();
  img.style.position = "absolute";
  img.style.zIndex = "-1";
  img.onload = image_loaded;
  img.onerror = image_error;
  img.src = "http://" + rest_host + ":8082/?action=snapshot&n=" + (++image_id);
  let gantry_1_mjpg_streamer = document.getElementById("gantry-1-mjpg_streamer");
  gantry_1_mjpg_streamer.insertBefore(img, gantry_1_mjpg_streamer.firstChild);
}
async function image_loaded() {
  this.style.zIndex = image_id;
  while (1 < loaded_images.length) {
    let image_to_remove = loaded_images.shift();
    image_to_remove.parentNode.removeChild(image_to_remove);
  }
  loaded_images.push(this);
  await insert_new_image_gantry_1_mjpg_streamer();
}
async function image_error() {
  await new Promise(r => setTimeout(r, 500.0));
  await insert_new_image_gantry_1_mjpg_streamer();
}
insert_new_image_gantry_1_mjpg_streamer();
</script>
