<button type="button" class="btn btn-primary" id="gantry-1-move_to_offset-right">></button>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
const gantry_1_move_to_offset_right = $("#gantry-1-move_to_offset-right");
function on_press_move_to_offset () {
  let dyn_args_query = "";
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/move_to_offset?add_to_history=bool:True&block=bool:True&x_offset_mm=float:10.0&y_offset_mm=float:0.0&mm_per_sec=float:100.0" + dyn_args_query,
    type: "GET"
  });
}
gantry_1_move_to_offset_right.on("mousedown touchstart", function () {
  on_press_move_to_offset();
});
</script>
