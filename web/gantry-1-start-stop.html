<div class="form-check form-switch switch-container">
  <input class="form-check-input" type="checkbox" role="switch" id="gantry-1-start-stop"/>
  <label class="form-check-label" for="gantry-1-start-stop">Started</label>
</div>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
const gantry_1_start_stop = $("#gantry-1-start-stop");
gantry_1_start_stop.on("change", function () {
  $.ajax({
    url: gantry_1_start_stop.is(":checked") ? "http://" + rest_host + ":" + rest_port + "/call/gantry-1/start" : "http://" + rest_host + ":" + rest_port + "/call/gantry-1/stop",
    type: "GET"
  });
});
async function gantry_1_start_stop_started() {
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/started",
    type: "GET",
    success: async function (return_value) {
      gantry_1_start_stop.prop("checked", return_value);
      await new Promise(r => setTimeout(r, 1000.0));
      await gantry_1_start_stop_started();
    },
    error: async function(xhr, error){
      console.log(error);
      await new Promise(r => setTimeout(r, 1000.0));
      await gantry_1_start_stop_started();
    }
  });
}
gantry_1_start_stop_started();
</script>
