<button type="button" class="btn btn-primary" id="gantry-1-wipe">Wipe</button>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
const gantry_1_wipe = $("#gantry-1-wipe");
function on_press_wipe () {
  let dyn_args_query = "&";
  let dyn_arg_value = document.getElementById("wipe-y_spacing_mm").value;
  dyn_args_query = dyn_args_query + "y_spacing_mm=float:" + dyn_arg_value;
  dyn_arg_value = document.getElementById("wipe-mm_per_sec").value;
  dyn_args_query = dyn_args_query + "&mm_per_sec=float:" + dyn_arg_value;
  dyn_arg_value = $("#wipe-block").is(":checked");
  dyn_args_query = dyn_args_query + "&block=bool:" + dyn_arg_value;
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/wipe?add_to_history=bool:True" + dyn_args_query,
    type: "GET"
  });
}
gantry_1_wipe.on("mousedown touchstart", function () {
  on_press_wipe();
});
</script>
