<button type="button" class="btn btn-primary" id="gantry-1-calibrate">Calibrate</button>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
const gantry_1_calibrate = $("#gantry-1-calibrate");
function on_press_calibrate () {
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/calibrate?mm_per_sec=float:10.0",
    type: "GET"
  });
}
gantry_1_calibrate.on("mousedown touchstart", function () {
  on_press_calibrate();
});
</script>
