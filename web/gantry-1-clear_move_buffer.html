<button type="button" class="btn btn-primary" id="gantry-1-clear_move_buffer">Clear Move Buffer</button>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
const gantry_1_clear_move_buffer = $("#gantry-1-clear_move_buffer");
function on_press_clear_move_buffer () {
  let dyn_args_query = "";
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/clear_move_buffer?" + dyn_args_query,
    type: "GET"
  });
}
gantry_1_clear_move_buffer.on("mousedown touchstart", function () {
  on_press_clear_move_buffer();
});
</script>
