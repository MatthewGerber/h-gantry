<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <title>Sand Art Table</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"/>
    <link rel="stylesheet" href="rpy-rest/mdbootstrap/css/mdb.min.css"/>
    <link rel="stylesheet" href="rpy-rest/styles.css"/>
</head>
<body>
<div class="container">
    <div class="rpy-div">
        <div class="row">
            <div class="col-md">
                <div class="text-center"><h5>Sand Art Table</h5></div>
            </div>
        </div>
    </div>
    <div class="accordion" id="gantry-accordion">

        <div class="accordion-item">
            <h2 class="accordion-header" id="main">
                <button class="accordion-button" type="button" data-mdb-toggle="collapse"
                        data-mdb-target="#collapse-main" aria-expanded="true" aria-controls="collapse-main"
                        style="background-color: aliceblue;">
                    Main
                </button>
            </h2>
            <div id="collapse-main" class="accordion-collapse collapse show" aria-labelledby="main">
                <div class="accordion-body" style="background-color: #fafafa;">
                    <div class="row">
                        <div class="col-md" style="display: flex; justify-content: center; align-items: center">
                            <div id="div-gantry-1-move_to_offset-up"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md" style="display: flex; justify-content: center; align-items: center">
                            <div id="div-gantry-1-move_to_offset-left"></div>
                        </div>
                        <div class="col-md">
                            <div id="div-gantry-1-get_line_plot"></div>
                        </div>
                        <div class="col-md" style="display: flex; justify-content: center; align-items: center">
                            <div id="div-gantry-1-move_to_offset-right"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md" style="display: flex; justify-content: center; align-items: center">
                            <div id="div-gantry-1-move_to_offset-down"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-4 rpy-margin" style="display: flex; justify-content: center; align-items: center">
                            <div id="div-gantry-1-clear_move_buffer"></div>
                        </div>
                        <div class="col-sm-4 rpy-margin" style="display: flex; justify-content: center; align-items: center">
                            <div id="div-gantry-1-center"></div>
                        </div>
                        <div class="col-sm-4 rpy-margin" style="display: flex; justify-content: center; align-items: center">
                            <div id="div-gantry-1-clear_point_history"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header" id="history">
                <button class="accordion-button collapsed" type="button" data-mdb-toggle="collapse"
                        data-mdb-target="#collapse-history" aria-expanded="false" aria-controls="collapse-history"
                        style="background-color: aliceblue;">
                    History
                </button>
            </h2>
            <div id="collapse-history" class="accordion-collapse collapse" aria-labelledby="history">
                <div class="accordion-body" style="background-color: #fafafa;">
                    <div class="row">
                        <div class="col-md" style="display: flex; justify-content: center; align-items: center">
                            <div id="div-app-call-history-list"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md rpy-margin">
                            <div id="div-app-call-history-enable_record_history-disable_record_history"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md rpy-margin">
                            <div id="div-app-call-history-start_macro-save_macro"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header" id="wipe">
                <button class="accordion-button collapsed" type="button" data-mdb-toggle="collapse"
                        data-mdb-target="#collapse-wipe" aria-expanded="false" aria-controls="collapse-wipe"
                        style="background-color: aliceblue;">
                    Wipe
                </button>
            </h2>
            <div id="collapse-wipe" class="accordion-collapse collapse" aria-labelledby="wipe">
                <div class="accordion-body" style="background-color: #fafafa;">
                    <div class="row">
                        <div class="col-md">
                            <div id="div-wipe-y_spacing_mm"></div>
                            <div id="div-wipe-mm_per_sec"></div>
                            <div id="div-wipe-block"></div>
                            <div id="div-gantry-1-wipe"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header" id="spiro">
                <button class="accordion-button collapsed" type="button" data-mdb-toggle="collapse"
                        data-mdb-target="#collapse-spiro" aria-expanded="false" aria-controls="collapse-spiro"
                        style="background-color: aliceblue;">
                    Spirograph
                </button>
            </h2>
            <div id="collapse-spiro" class="accordion-collapse collapse" aria-labelledby="spiro">
                <div class="accordion-body" style="background-color: #fafafa;">
                    <div class="row">
                        <div class="col-md">
                            <div id="div-spiro-upper-r"></div>
                            <div id="div-spiro-lower-r"></div>
                            <div id="div-spiro-d"></div>
                            <div id="div-spiro-theta_step"></div>
                            <div id="div-spiro-scale"></div>
                            <div id="div-spiro-mm_per_sec"></div>
                            <div id="div-spiro-ignore_moves_shorter_than_mm"></div>
                            <div id="div-spiro-return_to_current_position"></div>
                            <div id="div-spiro-block"></div>
                            <div id="div-gantry-1-draw_spirograph_from_params"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header" id="spiral">
                <button class="accordion-button collapsed" type="button" data-mdb-toggle="collapse"
                        data-mdb-target="#collapse-spiral" aria-expanded="false" aria-controls="collapse-spiral"
                        style="background-color: aliceblue;">
                    Spiral
                </button>
            </h2>
            <div id="collapse-spiral" class="accordion-collapse collapse" aria-labelledby="spiral">
                <div class="accordion-body" style="background-color: #fafafa;">
                    <div class="row">
                        <div class="col-md">
                            <div id="div-spiral-outer_diameter_mm"></div>
                            <div id="div-spiral-loop_spacing_mm"></div>
                            <div id="div-spiral-step_degrees"></div>
                            <div id="div-spiral-mm_per_sec"></div>
                            <div id="div-spiral-ignore_moves_shorter_than_mm"></div>
                            <div id="div-spiral-return_to_current_position"></div>
                            <div id="div-spiral-block"></div>
                            <div id="div-gantry-1-draw_spiral"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header" id="setup">
                <button class="accordion-button collapsed" type="button" data-mdb-toggle="collapse"
                        data-mdb-target="#collapse-setup" aria-expanded="false" aria-controls="collapse-setup"
                        style="background-color: aliceblue;">
                    Setup
                </button>
            </h2>
            <div id="collapse-setup" class="accordion-collapse collapse" aria-labelledby="setup">
                <div class="accordion-body" style="background-color: #fafafa;">
                    <div class="row">
                        <div class="col-md rpy-margin">
                            <div id="div-gantry-1-enable-disable"></div>
                            <div id="div-gantry-1-calibrate"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<script type="text/javascript" src="rpy-rest/mdbootstrap/js/mdb.min.js"></script>
<script src="https://code.jquery.com/jquery-3.4.1.js"></script>

<script>$("#div-gantry-1-move_to_offset-up").load("gantry-1-move_to_offset-up.html");</script>
<script>$("#div-gantry-1-move_to_offset-left").load("gantry-1-move_to_offset-left.html");</script>
<script>$("#div-gantry-1-move_to_offset-right").load("gantry-1-move_to_offset-right.html");</script>
<script>$("#div-gantry-1-move_to_offset-down").load("gantry-1-move_to_offset-down.html");</script>
<script>$("#div-gantry-1-get_line_plot").load("gantry-1-get_line_plot.html");</script>
<script>$("#div-gantry-1-center").load("gantry-1-center.html");</script>
<script>$("#div-gantry-1-clear_move_buffer").load("gantry-1-clear_move_buffer.html");</script>
<script>$("#div-gantry-1-clear_point_history").load("gantry-1-clear_point_history.html");</script>

<script>$("#div-app-call-history-list").load("app-call-history-list.html");</script>
<script>$("#div-app-call-history-enable_record_history-disable_record_history").load("app-call-history-enable_record_history-disable_record_history.html");</script>
<script>$("#div-app-call-history-start_macro-save_macro").load("app-call-history-start_macro-save_macro.html");</script>

<script>$("#div-wipe-y_spacing_mm").load("wipe-y_spacing_mm.html");</script>
<script>$("#div-wipe-mm_per_sec").load("wipe-mm_per_sec.html");</script>
<script>$("#div-wipe-block").load("wipe-block.html");</script>
<script>$("#div-gantry-1-wipe").load("gantry-1-wipe.html");</script>

<script>$("#div-spiro-upper-r").load("spiro-upper-r.html");</script>
<script>$("#div-spiro-lower-r").load("spiro-lower-r.html");</script>
<script>$("#div-spiro-d").load("spiro-d.html");</script>
<script>$("#div-spiro-theta_step").load("spiro-theta_step.html");</script>
<script>$("#div-spiro-scale").load("spiro-scale.html");</script>
<script>$("#div-spiro-mm_per_sec").load("spiro-mm_per_sec.html");</script>
<script>$("#div-spiro-return_to_current_position").load("spiro-return_to_current_position.html");</script>
<script>$("#div-spiro-block").load("spiro-block.html");</script>
<script>$("#div-spiro-ignore_moves_shorter_than_mm").load("spiro-ignore_moves_shorter_than_mm.html");</script>
<script>$("#div-gantry-1-draw_spirograph_from_params").load("gantry-1-draw_spirograph_from_params.html");</script>

<script>$("#div-spiral-outer_diameter_mm").load("spiral-outer_diameter_mm.html");</script>
<script>$("#div-spiral-loop_spacing_mm").load("spiral-loop_spacing_mm.html");</script>
<script>$("#div-spiral-step_degrees").load("spiral-step_degrees.html");</script>
<script>$("#div-spiral-mm_per_sec").load("spiral-mm_per_sec.html");</script>
<script>$("#div-spiral-return_to_current_position").load("spiral-return_to_current_position.html");</script>
<script>$("#div-spiral-block").load("spiral-block.html");</script>
<script>$("#div-spiral-ignore_moves_shorter_than_mm").load("spiral-ignore_moves_shorter_than_mm.html");</script>
<script>$("#div-gantry-1-draw_spiral").load("gantry-1-draw_spiral.html");</script>

<script>$("#div-gantry-1-calibrate").load("gantry-1-calibrate.html");</script>
<script>$("#div-gantry-1-enable-disable").load("gantry-1-enable-disable.html")</script>

</body>
</html>
