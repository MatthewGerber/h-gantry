<button type="button" class="btn btn-primary" id="gantry-1-draw_spirograph_from_params">Draw</button>
<script type="module">
import {rest_host, rest_port} from "./globals.js";
const gantry_1_draw_spirograph_from_params = $("#gantry-1-draw_spirograph_from_params");
function on_press_draw_spirograph_from_params () {
  let dyn_args_query = "";
  let dyn_arg_value = document.getElementById("spiro-upper-r").value;
  dyn_args_query = dyn_args_query + "R=float:" + dyn_arg_value;
  dyn_arg_value = document.getElementById("spiro-lower-r").value;
  dyn_args_query = dyn_args_query + "&r=float:" + dyn_arg_value;
  dyn_arg_value = document.getElementById("spiro-d").value;
  dyn_args_query = dyn_args_query + "&d=float:" + dyn_arg_value;
  dyn_arg_value = document.getElementById("spiro-theta_step").value;
  dyn_args_query = dyn_args_query + "&theta_step=float:" + dyn_arg_value;
  dyn_arg_value = document.getElementById("spiro-scale").value;
  dyn_args_query = dyn_args_query + "&scale=float:" + dyn_arg_value;
  dyn_arg_value = document.getElementById("spiro-mm_per_sec").value;
  dyn_args_query = dyn_args_query + "&mm_per_sec=float:" + dyn_arg_value;
  dyn_arg_value = document.getElementById("spiro-ignore_moves_shorter_than_mm").value;
  dyn_args_query = dyn_args_query + "&ignore_moves_shorter_than_mm=float:" + dyn_arg_value;
  dyn_arg_value = $("#{element_id}").is(":checked");
  dyn_args_query = dyn_args_query + "&return_to_current_position=bool:" + dyn_arg_value;
  dyn_arg_value = $("#{element_id}").is(":checked");
  dyn_args_query = dyn_args_query + "&block=bool:" + dyn_arg_value;
  dyn_arg_value = $("#{element_id}").is(":checked");
  dyn_args_query = dyn_args_query + "&check_bounds=bool:" + dyn_arg_value;
  $.ajax({
    url: "http://" + rest_host + ":" + rest_port + "/call/gantry-1/draw_spirograph_from_params?" + dyn_args_query,
    type: "GET"
  });
}
gantry_1_draw_spirograph_from_params.on("mousedown touchstart", function () {
  on_press_draw_spirograph_from_params();
});
</script>
